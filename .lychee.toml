# Retry generously: the security pages cite ~34 github.com/.../blob/main
# source links, and GitHub intermittently returns 429/502 under that
# volume. More retries with a longer backoff rides out transient 5xx/429
# without masking real failures — a genuine 404 still fails after retries.
max_retries = 5
retry_wait_time = 4
timeout = 30
no_progress = true
exclude = [
  "https://www.linkedin.com/.*",
  "https://dxt.so/.*",
  "https://lobehub.com/.*",
  "https://www.npmjs.com/package/@dollhousemcp/mcp-server.*",
  "https://mcpaql.com/.*",
  # Site's own production origin. jekyll-seo-tag emits an absolute
  # canonical (and og:url) <link> to https://dollhousemcp.com/<page> on
  # every page; for any page not yet deployed (i.e. every new page in a
  # PR) lychee resolves that against production and gets a 404 — a
  # guaranteed false positive that clears the moment the PR is deployed.
  # Internal correctness is still fully checked: lychee resolves
  # root-relative links against the local _site build (--root-dir _site).
  "^https?://(www\\.)?dollhousemcp\\.com(/.*)?$",
  # RFC 2606 / 6761 reserved names used in documentation and examples —
  # these should never be resolved by lychee even if a tutorial references them.
  "^https?://localhost(:\\d+)?(/.*)?$",
  "^https?://127\\.0\\.0\\.1(:\\d+)?(/.*)?$",
  "^https?://\\[::1\\](:\\d+)?(/.*)?$",
  "^https?://([a-z0-9-]+\\.)*example\\.(com|org|net)(/.*)?$",
  "^https?://([a-z0-9-]+\\.)*(test|invalid|local)(/.*)?$"
]
