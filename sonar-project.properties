# SonarCloud analysis configuration.
#
# Exclude vendored / third-party minified bundles from analysis. These are
# not our source: scanning them produces false positives (e.g. mermaid's
# own minified Unicode-handling code trips the bidirectional-character
# rule text:S6389), which is unfair to the new-code security rating.
# Our own scripts (assets/js/site.js, assets/js/mermaid-init.js) are not
# minified and remain in scope.
sonar.exclusions=**/*.min.js
